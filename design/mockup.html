<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch — Thiết kế giao diện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E4E5EA;
  --bg:#F2F3F7; --surface:#FFFFFF; --ink:#0E0E10; --muted:#8A8D97; --line:#E6E7EC;
  --primary:#0E0E10; --on-primary:#FFFFFF;
  --yellow:#FCE8A6; --pink:#F8D2E2; --lilac:#DDD2EF; --sage:#D5E6DF; --sky:#DCE6FB;
  --der:#2F6FEB; --die:#E5484D; --das:#2E9E5B; --ok:#2E9E5B; --bad:#E5484D;
  --scr:.65; --kbd:#D3D5DB; --key:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --page:#08090B;
    --bg:#111216; --surface:#1C1D22; --ink:#F4F4F6; --muted:#9A9CA6; --line:#2C2D33;
    --primary:#F4F4F6; --on-primary:#0E0E10;
    --yellow:#4A4127; --pink:#47293A; --lilac:#362E47; --sage:#2A3B35; --sky:#26304A;
    --der:#6E9BFF; --die:#FF7B7F; --das:#5FCB8A; --ok:#5FCB8A; --bad:#FF7B7F;
    --scr:.08; --kbd:#2A2B30; --key:#46474D;
  }
}
:root[data-theme=dark]{
  --page:#08090B;
  --bg:#111216; --surface:#1C1D22; --ink:#F4F4F6; --muted:#9A9CA6; --line:#2C2D33;
  --primary:#F4F4F6; --on-primary:#0E0E10;
  --yellow:#4A4127; --pink:#47293A; --lilac:#362E47; --sage:#2A3B35; --sky:#26304A;
  --der:#6E9BFF; --die:#FF7B7F; --das:#5FCB8A; --ok:#5FCB8A; --bad:#FF7B7F;
  --scr:.08; --kbd:#2A2B30; --key:#46474D;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--page);color:var(--ink);padding:40px 24px 80px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}

/* ---------- trang trình bày ---------- */
.intro{max-width:1240px;margin:0 auto 36px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.intro h1{font-size:30px;letter-spacing:-.02em}
.intro p{color:var(--muted);margin-top:6px;max-width:620px;line-height:1.5}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--surface);padding:6px 12px;border-radius:999px}
.legend i{width:12px;height:12px;border-radius:50%}
.theme{padding:10px 18px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:14px}
.gallery{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px 28px;justify-content:center}
figure{display:flex;flex-direction:column;align-items:center;gap:14px}
figcaption{font-size:13px;color:var(--muted);text-align:center}
figcaption b{color:var(--ink);font-weight:600;display:block;font-size:15px;margin-bottom:2px}

/* ---------- khung điện thoại ---------- */
.phone{width:375px;height:812px;border-radius:44px;background:var(--bg);position:relative;overflow:hidden;outline:1px solid var(--line)}
.scr{position:absolute;inset:0;overflow-y:auto;padding:0 20px 120px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.status{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-weight:600;font-size:15px;position:sticky;top:0;background:var(--bg);z-index:5;margin:0 -20px;padding:0 30px}
.status .sig{display:flex;gap:5px;align-items:center}
.status .sig b{display:inline-block;width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
.status .sig b::after{content:"";position:absolute;inset:1.5px;right:4px;background:var(--ink);border-radius:1px}

/* ---------- chung ---------- */
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px}
h1.t{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.muted{color:var(--muted)}
.sm{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.circ{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.circ.dark{background:var(--primary);color:var(--on-primary)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.chip.dark{background:var(--primary);color:var(--on-primary)}
.chip.ghost{background:transparent;outline:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.lbl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.btn{height:52px;border-radius:999px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--surface)}
.btn.wide{width:100%}
.btn.small{height:40px;font-size:14px;padding:0 16px}
kbd{font:inherit;font-size:12px;opacity:.6;border:1px solid currentColor;border-radius:6px;padding:1px 6px}

.blk{border-radius:28px;padding:20px;position:relative;margin-bottom:12px}
.blk.white{background:var(--surface)}
.yellow{background:var(--yellow)} .pink{background:var(--pink)} .lilac{background:var(--lilac)}
.sage{background:var(--sage)} .sky{background:var(--sky)}
.scribble{isolation:isolate}
.scribble::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;opacity:var(--scr);
  background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 150'%3E%3Cpath d='M18 118C60 74 98 46 168 18M30 140C82 96 122 70 192 44M70 148C116 116 150 98 198 86' fill='none' stroke='white' stroke-width='15' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right top/78% auto}
.notch{padding-right:76px}
.nbtn{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 0 0 7px var(--bg)}

/* mạo từ */
.art{display:inline-flex;align-items:center;font-weight:700;padding:0 8px;border-radius:8px;line-height:1.5}
.art.der{color:var(--der);background:color-mix(in srgb,var(--der) 13%,transparent)}
.art.die{color:var(--die);background:color-mix(in srgb,var(--die) 13%,transparent)}
.art.das{color:var(--das);background:color-mix(in srgb,var(--das) 13%,transparent)}

/* hàng phím umlaut */
.uml{display:flex;gap:6px;margin-bottom:8px}
.uml button{flex:1;height:40px;border-radius:12px;background:var(--surface);font-size:17px;font-weight:500;outline:1px solid var(--line)}
.uml button:active{background:var(--primary);color:var(--on-primary)}
.field{background:var(--surface);border-radius:20px;padding:0 18px;height:60px;display:flex;align-items:center;outline:2px solid var(--line)}
.field:focus-within{outline-color:var(--ink)}
.field input{width:100%;font-size:20px;outline:none}

/* điều hướng dưới */
.nav{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;padding:7px;background:var(--surface);border-radius:999px;z-index:6;box-shadow:0 0 0 8px color-mix(in srgb,var(--bg) 70%,transparent)}
.nav a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--bg)}
.nav a.on{background:var(--primary);color:var(--on-primary)}

/* ---------- Hôm nay ---------- */
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:10px 0 6px}
.big span{font-size:18px;font-weight:600;letter-spacing:0}
.mid{font-size:19px;font-weight:700;margin:6px 0 4px;line-height:1.3}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.task:last-of-type{border-bottom:0}
.cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.task.done .cb{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.task .min{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.carry{margin-top:6px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.carry button{margin-left:auto;font-weight:600;color:var(--ink);font-size:13px}
.bar{height:10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin:12px 0 8px}
.bar div{height:100%;background:var(--primary);border-radius:inherit}
.days{display:flex;gap:6px;margin-top:14px}
.days span{flex:1;height:34px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.days span.on{background:var(--primary);color:var(--on-primary)}
.days span.today{outline:2px solid var(--primary)}

/* ---------- Ôn ---------- */
.rtop{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.rtop .bar{flex:1;margin:0}
.qcard{position:relative;border-radius:28px;padding:22px;min-height:220px;display:flex;flex-direction:column;margin-bottom:16px}
.qcard .q{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:auto 0 6px;padding-top:30px}
.kb{position:absolute;left:0;right:0;bottom:0;background:var(--kbd);padding:8px 4px 30px;z-index:7}
.kb .kr{display:flex;gap:5px;justify-content:center;margin-bottom:9px}
.kb .kr span{width:31px;height:42px;border-radius:6px;background:var(--key);display:grid;place-items:center;font-size:18px}
.kb .kr span.w{width:46px;font-size:13px}
.kb .kr span.sp{width:180px}
.res{border-radius:28px;padding:20px;background:var(--surface);margin-bottom:14px}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--bad)}
.verdict i{width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-style:normal}
.yours{margin-top:12px;color:var(--muted);font-size:15px}
.yours s{color:var(--bad);text-decoration-thickness:2px}
.ans{font-size:30px;font-weight:700;display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.ans .art{font-size:30px}
.ans .circ{margin-left:auto;background:var(--bg)}
.ex{margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--bg);font-size:17px;line-height:1.45}
.ex small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.logged{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13px;padding:10px 14px;border-radius:14px;background:var(--pink)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.rates button{border-radius:18px;background:var(--surface);padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:15px}
.rates button small{font-size:12px;font-weight:500;color:var(--muted)}
.rates button.sel{background:var(--primary);color:var(--on-primary)}
.rates button.sel small{color:inherit;opacity:.7}

/* ---------- Thêm ---------- */
.tabs{display:flex;gap:6px;background:var(--surface);padding:5px;border-radius:999px;margin-bottom:14px}
.tabs button{flex:1;height:40px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--primary);color:var(--on-primary)}
.seg{display:flex;gap:8px;margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:600;opacity:.65;margin:0 0 5px 4px}
.f .v{background:var(--surface);border-radius:14px;padding:11px 14px;font-size:15px;line-height:1.4}
.f .v small{display:block;color:var(--muted)}
.artsel{display:flex;gap:6px}
.artsel span{flex:1;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;background:var(--surface);font-size:16px}
.artsel span.on.der{background:var(--der);color:#fff}
.artsel .der{color:var(--der)} .artsel .die{color:var(--die)} .artsel .das{color:var(--das)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface)}
.cards-note{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px;align-items:center;font-size:13px;color:var(--muted)}

/* ---------- Viết ---------- */
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps span{flex:1;text-align:center;font-size:13px;font-weight:600;padding:8px 0;border-radius:999px;background:var(--surface);color:var(--muted)}
.steps span.on{background:var(--primary);color:var(--on-primary)}
.steps span.done{color:var(--ink)}
.txt{font-size:18px;line-height:1.75;outline:none}
.err{background:none;color:inherit;border-bottom:2.5px solid var(--bad);padding-bottom:1px;position:relative}
.err sup{font-size:11px;font-weight:700;color:var(--bad);margin-left:2px}
.hint{display:flex;gap:12px;background:var(--surface);border-radius:20px;padding:14px 16px;margin-bottom:8px}
.hint .n{width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.hint b{font-size:15px}
.hint p{font-size:14px;margin-top:4px;line-height:1.45}
.hint .chip{height:22px;font-size:11px;padding:0 8px;background:var(--pink);margin-left:6px}

/* ---------- Gia sư ---------- */
.ctx{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 16px;padding:0 20px;scrollbar-width:none}
.msg{max-width:88%;padding:14px 16px;border-radius:22px;font-size:15px;line-height:1.5;margin-bottom:10px}
.msg.me{margin-left:auto;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px}
.msg.bot{background:var(--surface);border-bottom-left-radius:6px}
.msg.bot p+p{margin-top:8px}
.exbox{margin-top:10px;border-radius:16px;background:var(--sage);padding:12px 14px}
.exbox .de{font-size:17px;font-weight:600}
.exbox .vi{font-size:14px;opacity:.75;margin-top:2px}
.exbox .row{margin-top:10px}
.exbox .chip{height:30px;font-size:12px}
.compose{position:absolute;left:0;right:0;bottom:98px;padding:10px 16px 0;background:linear-gradient(transparent,var(--bg) 20%);z-index:6}
.compose .uml button{height:34px;font-size:15px}
.compose .field{height:52px;padding-right:6px;border-radius:999px}
.compose .field input{font-size:16px}

/* ---------- Sổ lỗi / Tiến độ ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{border-radius:22px;padding:16px;background:var(--surface)}
.tile .num{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .sm{margin-top:2px}
.chart{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:14px}
.chart div{flex:1;border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.chart div.on{background:var(--primary)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.hscroll{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 14px;padding:0 20px;scrollbar-width:none}
.ecard{background:var(--surface);border-radius:24px;padding:18px;margin-bottom:10px}
.ecard h3{font-size:17px;font-weight:700;line-height:1.3}
.ecard .cnt{margin-left:auto;font-weight:700;font-size:14px;background:var(--pink);border-radius:999px;padding:4px 10px;white-space:nowrap}
.ecard p{font-size:14px;color:var(--muted);margin:6px 0 10px;line-height:1.45}
.pair{display:flex;align-items:center;gap:8px;font-size:15px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.pair s{color:var(--bad);text-decoration-thickness:1.5px}
.pair b{color:var(--ok);font-weight:600}
.close{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.pips{display:flex;gap:4px}
.pips i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--ok)}
.tl{list-style:none;margin-top:12px}
.tl li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.tl .lv{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--surface) 60%,transparent);flex:none}
.tl li.done .lv{background:var(--primary);color:var(--on-primary)}
.tl .d{margin-left:auto;font-weight:600;font-size:15px;text-align:right}
.tl .d small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tl li.warn .d{color:var(--bad)}
.warnbox{margin-top:12px;border-radius:16px;padding:12px 14px;background:var(--surface);font-size:14px;line-height:1.45;display:flex;gap:10px}
.warnbox .i{color:var(--bad);margin-top:1px}
</style>
</head>

<header class="intro">
  <div>
    <h1>Deutsch · Thiết kế giao diện</h1>
    <p>8 màn hình theo SPEC mục 7, thiết kế ở 375px. Mỗi khối chức năng có một màu pastel cố định; nút đen là hành động chính. Các ô gõ tiếng Đức bấm thử được hàng phím umlaut.</p>
    <div class="legend">
      <span><i style="background:var(--yellow)"></i>Ôn thẻ</span>
      <span><i style="background:var(--pink)"></i>Sổ lỗi</span>

// Hàng phím umlaut: chèn tại con trỏ, giữ focus
let lastField = null;
document.addEventListener('focusin', e => {
  if (e.target.matches('input, [contenteditable]')) lastField = e.target;
});
document.querySelectorAll('.uml').forEach(row => {
  row.addEventListener('mousedown', e => e.preventDefault());
  row.addEventListener('click', e => {
    const key = e.target.closest('button'); if (!key) return;
    const target = row.dataset.for ? document.getElementById(row.dataset.for)
      : row.closest('.scr, .phone').querySelector('input, [contenteditable]');
    const el = lastField && row.closest('.phone').contains(lastField) ? lastField : target;
    if (!el) return;
    el.focus();
    if (el.isContentEditable) { document.execCommand('insertText', false, key.textContent); return; }
    const s = el.selectionStart ?? el.value.length, en = el.selectionEnd ?? s;
    el.setRangeText(key.textContent, s, en, 'end');
  });
});

// Nút chấm điểm
document.getElementById('rates').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b));
});

// Đổi giao diện sáng/tối
const modes = [['', 'theo hệ thống'], ['light', 'sáng'], ['dark', 'tối']];
let m = 0;
document.getElementById('theme').addEventListener('click', e => {
  m = (m + 1) % modes.length;
  const [v, label] = modes[m];
  v ? document.documentElement.dataset.theme = v : delete document.documentElement.dataset.theme;
  e.currentTarget.textContent = 'Giao diện: ' + label;
});
</script>
</body>
</html>
